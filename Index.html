<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BID</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/index.css">
    <script type="module" src="script/main.js"></script>
</head>
<body>
    <header>
        
        <a id="botao_login">Registrar Jogadores</a>
<!-- Se quiser botar o style do botao no arquivo css acho que ficaria melhor -->
    
    </header>
    <div id="container-busca">
        <form id="formulario-busca">
            <select id="estado-busca">
                <option value="">Estados</option>

                <optgroup label="Sul">
                <option value="Parana">PR</option>
                <option value="Rio Grande do Sul">RS</option>
                <option value="Santa Catarina">SC</option>
                </optgroup>

                <optgroup label="Sudeste">
                <option value="Espirito Santo">ES</option>
                <option value="Minas Gerais">MG</option>
                <option value="Rio de Janeiro">RJ</option>
                <option value="Sao Paulo">SP</option>
                </optgroup>

                <optgroup label="Centro-Oeste">
                <option value="Distrito Federal">DF</option>
                <option value="Goias">GO</option>
                <option value="Mato grosso do Sul">MS</option>
                <option value="Mato Grosso">MT</option>
                </optgroup>

                <optgroup label="Nordeste">
                <option value="Alagoas">AL</option>
                <option value="Bahia">BA</option>
                <option value="Ceara">CE</option>
                <option value="Maranhao">MA</option>
                <option value="Paraiba">PB</option>
                <option value="Pernambuco">PE</option>
                <option value="Piaui">PI</option>
                <option value="Rio Grande do Norte">RN</option>
                <option value="Sergipe">SE</option>
                </optgroup>

                <optgroup label="Norte">
                <option value="Acre">AC</option>
                <option value="Amazonas">AM</option>
                <option value="Amapa">AP</option>
                <option value="Para">PA</option>
                <option value="Rondonia">RO</option>
                <option value="Roraima">RR</option>
                <option value="Tocantins">TO</option>
                </optgroup>

            </select>
            <select id="clube-busca">
                <option value="">Todos os clubes</option>
                <option></option>
            </select>
        </form>
        <button id="botao-busca">Buscar</button>
        <div id="lista-jogadores"></div>
    </div>
    <div id="overlay-modal-stats">
        <div id="modal-stats">
            <button id="botao-fechar-stats">✕</button>
            <div class="stats-header">
                <span id="stats-nome"></span>
                <span id="stats-apelido"></span>
            </div>
            <div class="stats-grid">
                <div class="stat-item">
                    <span class="stat-valor" id="stats-partidas">0</span>
                    <span class="stat-label">Partidas</span>
                </div>
                <div class="stat-item">
                    <span class="stat-valor" id="stats-gols">0</span>
                    <span class="stat-label">Gols</span>
                </div>
                <div class="stat-item">
                    <span class="stat-valor" id="stats-assistencias">0</span>
                    <span class="stat-label">Assistências</span>
                </div>
                <div class="stat-item amarelo">
                    <span class="stat-valor" id="stats-amarelo">0</span>
                    <span class="stat-label">Amarelos</span>
                </div>
                <div class="stat-item vermelho">
                    <span class="stat-valor" id="stats-vermelho">0</span>
                    <span class="stat-label">Vermelhos</span>
                </div>
                <div class="stat-item">
                    <span class="stat-valor" id="stats-substituicoes">0</span>
                    <span class="stat-label">Substituições</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
