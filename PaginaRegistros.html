<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/registros.css">
</head>
<body>
    <header>
        <a id="logout">Logout</a>
        <a href="Index.html" class="botao-voltar">← Voltar</a>
    </header>
    <div id="apresentacao-add">
        
    </div>
    
    <div id="registrar-time">
        <form id="formulario-busca">
            <select id="estado-busca">
                <option value="">Estados</option>
                
                <optgroup label="Sul">
                    <option value="Parana">PR</option>
                    <option value="Rio Grande do Sul">RS</option>
                    <option value="Santa Catarina">SC</option>
                </optgroup>
                
                <optgroup label="Sudeste">
                    <option value="Espirito Santo">ES</option>
                    <option value="Minas Gerais">MG</option>
                    <option value="Rio de Janeiro">RJ</option>
                    <option value="Sao Paulo">SP</option>
                </optgroup>
                
                <optgroup label="Centro-Oeste">
                    <option value="Distrito Federal">DF</option>
                    <option value="Goias">GO</option>
                    <option value="Mato grosso do Sul">MS</option>
                    <option value="Mato Grosso">MT</option>
                </optgroup>
                
                <optgroup label="Nordeste">
                    <option value="Alagoas">AL</option>
                    <option value="Bahia">BA</option>
                    <option value="Ceara">CE</option>
                    <option value="Maranhao">MA</option>
                    <option value="Paraiba">PB</option>
                    <option value="Pernambuco">PE</option>
                    <option value="Piaui">PI</option>
                    <option value="Rio Grande do Norte">RN</option>
                    <option value="Sergipe">SE</option>
                </optgroup>
                
                <optgroup label="Norte">
                    <option value="Acre">AC</option>
                    <option value="Amazonas">AM</option>
                    <option value="Amapa">AP</option>
                    <option value="Para">PA</option>
                    <option value="Rondonia">RO</option>
                    <option value="Roraima">RR</option>
                    <option value="Tocantins">TO</option>
                </optgroup>
                
            </select>
            <select id="clube-busca">
                <option value="">Todos os clubes</option>
                <option></option>
            </select>
        </form>
        <div class="botoes-acao">
            <button id="botao-busca">Buscar</button>
            <button id="botao-abrir-modal" class="desabilitado">+ Registrar Jogador</button>
        </div>
    </div>
     <div id="lista-jogadores"></div>
    
    <!-- Modal -->
    <div id="overlay-modal">
        <div id="modal-registro">
            <button id="botao-fechar-modal">✕</button>
            
            <div class="campo-modal">
                <label>Nome do Atleta</label>
                <input type="text" id="registrar-nome" placeholder="Nome completo">
            </div>
            
            <div class="campo-modal">
                <label>Foto</label>
                <input type="file" id="registrar-foto" accept="image/*">
            </div>
            
            <div class="campo-modal">
                <label>Número do Contrato</label>
                <input type="text" id="registrar-contrato" placeholder="Nº do contrato">
            </div>
            
            <div class="campo-modal">
                <label>Tipo de Contrato</label>
                <select id="tipoContrato">
                    <option value="definitivo">Definitivo</option>
                    <option value="emprestimo">Empréstimo</option>
                    <option value="rescisao">Rescisão</option>
                </select>
            </div>
            
            <div class="campo-modal">
                <label>Data de Publicação</label>
                <input type="date" id="registrar-publicacao">
            </div>
            
            <div class="campo-modal">
                <label>Início do Contrato</label>
                <input type="date" id="registrar-inicio">
            </div>
            
            <div class="campo-modal">
                <label>Número de Inscrição</label>
                <input type="number" id="registrar-inscricao" placeholder="Nº de inscrição">
            </div>
            
            <div class="campo-modal">
                <label>Apelido</label>
                <input type="text" id="registrar-apelido" placeholder="Apelido">
            </div>
            
            <div class="campo-modal">
                <label>Data de Nascimento</label>
                <input type="date" id="registrar-nascimento">
            </div>
            
            <button id="botao-confirmar-registro">Confirmar Registro</button>
        </div>
    </div>
</body>
<script type="module" src="script/registros.js"></script>
</html>
